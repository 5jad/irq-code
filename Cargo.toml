[workspace]
resolver = "2"
members = [
  "crates/irq-ast",
  "crates/irq-lexer",
  "crates/irq-parser",
  "crates/irq-diagnostics",
  "crates/irq-check",
  "crates/irq-hir",
  "crates/irq-codegen-rust",
  "crates/irq-project",
  "crates/irq-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde_json = "1"
